<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1b4b" />
    <link rel="icon" type="image/png" href="/mpokket-mark.png" />
    <title>QA Platform</title>
    <script>
      (function () {
        try {
          var k = "qa-hub-theme";
          var t = localStorage.getItem(k);
          if (
            t === "dark" ||
            (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen bg-[#f3eef7] text-slate-900 antialiased transition-colors dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
