# File-based H2 under ./data/ — data survives restarts when only ONE JVM uses this file.
#
# ERROR 90020 "already in use" / "file is locked" = another process still has qa-platform.mv.db open
# (IntelliJ Run + Gradle bootRun, second bootRun, H2 Console, zombie java.exe). Stop all of those, then start ONE hub.
#
# Run:  .\gradlew.bat bootRun --args="--spring.profiles.active=filedb"
# IDEA: Active profiles: filedb
#
spring:
  datasource:
    url: jdbc:h2:file:./data/qa-platform;AUTO_SERVER=TRUE;AUTO_SERVER_PORT=9093;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
